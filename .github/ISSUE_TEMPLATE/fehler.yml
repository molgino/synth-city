name: Bug report / Fehler melden
description: Something does not work on the R36S, the desktop or the phone app.
labels: [bug]
body:
  - type: dropdown
    id: where
    attributes:
      label: Where?
      options: [SYNTH CITY OS (R36S), ArkOS (R36S), Linux-Desktop, Phone app / browser, Building / CI]
    validations: {required: true}
  - type: input
    id: version
    attributes:
      label: Version / build
      placeholder: e.g. nightly from 15 Nov 2026 (SET → Info)
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Steps to reproduce; a screenshot or log (web page → Logs) helps a lot.
    validations: {required: true}
