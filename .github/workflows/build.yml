name: Build

on:
  push:
    branches: [main, 'ui-*']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # App-Update fuer das Groovebox-OS (arm64, DRM-Ausgabe) -> dist/groovebox-os-update.tgz
  os-app:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Abhaengigkeiten
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsdl2-dev libasound2-dev libdrm-dev pkg-config python3-numpy
      - name: Bauen
        run: |
          make -j4 DRM=1
          ./tools/os-update.sh groovebox
      - name: Leistungstest (arm64)
        run: |
          python3 tools/gensamples.py samples
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy ./groovebox --bench dist/bench-arm64.txt
      - uses: actions/upload-artifact@v4
        with: { name: groovebox-os-update, path: dist/groovebox-os-update.tgz }
      - uses: actions/upload-artifact@v4
        with: { name: bench-arm64, path: dist/bench-arm64.txt }

  # Unit-Tests, UI-Tests, Stresstest - mit AddressSanitizer/UBSan
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Abhaengigkeiten
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsdl2-dev libasound2-dev
      - name: Unit-Tests (Sanitizer)
        run: make test SAN=1
      - name: Mehrkern-Audio (ThreadSanitizer)
        run: make test-tsan
      - name: UI-Tests + Stresstest (Sanitizer)
        run: |
          make clean
          make -j4 SAN=1
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy ASAN_OPTIONS=detect_leaks=0 ./groovebox --selftest 60

  build:
    needs: [os-app, tests]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Abhaengigkeiten
        timeout-minutes: 25
        run: |   # Azure-Spiegel war zeitweise extrem langsam: nach einem Fehlversuch auf archive.ubuntu.com wechseln
          ok=0
          for i in 1 2 3; do
            if [ $i -ge 2 ]; then
              echo "Wechsel auf archive.ubuntu.com"
              printf 'http://archive.ubuntu.com/ubuntu/\tpriority:1\n' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
              sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
            fi
            timeout 420 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update &&
            timeout 420 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y g++-aarch64-linux-gnu libsdl2-dev libasound2-dev zip python3-numpy && { ok=1; break; }
            echo "apt-Versuch $i fehlgeschlagen, neuer Versuch"; sleep 10
          done
          [ $ok = 1 ] || { echo "apt: alle Versuche fehlgeschlagen"; exit 1; }

      - name: Desktop-Build (Kompilierpruefung)
        run: make

      - name: Handbuch (PDF mit Screenshots aus der App)
        run: |
          python3 tools/gensamples.py
          pip install --quiet markdown pillow
          python3 tools/handbuch/build.py --out dist/SYNTH-CITY-Handbuch.pdf

      - name: Cross-Build fuer den R36S (aarch64, ArkOS)
        run: ./tools/cross-build.sh

      - name: Paket
        run: |
          python3 tools/gensamples.py
          ./tools/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: r36s-groovebox-arkos
          path: dist/r36s-groovebox-arkos.zip

      - uses: actions/download-artifact@v4
        with: { name: groovebox-os-update, path: dist }
      - uses: actions/download-artifact@v4
        with: { name: bench-arm64, path: dist }

      - name: Release "nightly" aktualisieren
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly dist/r36s-groovebox-arkos.zip dist/groovebox-os-update.tgz dist/bench-arm64.txt dist/SYNTH-CITY-Handbuch.pdf --prerelease \
            --title "SYNTH CITY Nightly ($(git rev-parse --short HEAD))" \
            --notes "Automatischer Build von main ($(git rev-parse --short HEAD)). Handbuch: SYNTH-CITY-Handbuch.pdf. ArkOS: r36s-groovebox-arkos.zip. Groovebox-OS: groovebox-os-update.tgz (App-Update ohne neues Image)." --target "$GITHUB_SHA"

      - name: Test-Release fuer UI-Branches (nightly-<branch>)
        if: startsWith(github.ref, 'refs/heads/ui-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="nightly-${GITHUB_REF_NAME}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" dist/r36s-groovebox-arkos.zip dist/groovebox-os-update.tgz dist/bench-arm64.txt dist/SYNTH-CITY-Handbuch.pdf --prerelease \
            --title "SYNTH CITY Test ${GITHUB_REF_NAME} ($(git rev-parse --short HEAD))" \
            --notes "Testversion vom Branch ${GITHUB_REF_NAME}. Groovebox-OS: groovebox-os-update.tgz im Browser unter Update einspielen. Zurueck: Update aus dem Release nightly einspielen." --target "$GITHUB_SHA"

      - name: Versions-Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/r36s-groovebox-arkos.zip dist/SYNTH-CITY-Handbuch.pdf --title "$GITHUB_REF_NAME" --generate-notes
