# Alle Tests auf Knopfdruck: GitHub -> Actions -> "Tests (Knopfdruck)" -> "Run workflow".
# Ergebnis als Tabelle in der Zusammenfassung des Laufs (auch am Handy lesbar) und als Datei testbericht.md.
name: Tests (Knopfdruck)
on:
  workflow_dispatch:
    inputs:
      voll:
        description: 'Zusaetzlich mit Sanitizern (findet Speicherfehler, dauert laenger)'
        type: boolean
        default: true
jobs:
  alle-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Abhaengigkeiten
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsdl2-dev libasound2-dev
      - name: Alle Tests
        run: tools/test-all.sh ${{ inputs.voll && '--voll' || '' }}
      - name: Testbericht
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testbericht
          path: dist/testbericht.md

  handy-app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with: { version: 3.1.74 }
      - name: Web-App bauen
        run: python3 tools/webapp/build.py --out dist/webapp
      - name: Handy-App-Szenarien
        run: |
          npm i --no-save --prefix /tmp/pw playwright@1.48.2
          npx --prefix /tmp/pw playwright install --with-deps chromium
          NODE_PATH=/tmp/pw/node_modules node tests/app/app_scenarios.js dist/webapp | tee app.log
          { echo "## Handy-App"; echo; grep -E '^(OK|FEHLER)' app.log | sed -E 's/^OK +/- ✅ /; s/^FEHLER /- ❌ /'; } >> "$GITHUB_STEP_SUMMARY"
