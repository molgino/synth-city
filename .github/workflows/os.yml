name: Groovebox-OS

# Baut das eigene SD-Karten-Image fuer den R36S (Kernel, U-Boot, Debian-Grundsystem, Groovebox)
on:
  push:
    branches: [main]
    paths: ['os/**', '!os/rootfs/overlay/opt/groovebox/pc-modus.sh']   # Aenderung nur an dieser Datei: per workflow_dispatch starten   # App-Aenderungen (auch pc-modus.sh) kommen per App-Update (build.yml)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: os-${{ github.ref }}
  cancel-in-progress: true

jobs:
  uboot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Abhaengigkeiten
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu bc bison flex swig python3-dev python3-setuptools \
            python3-pyelftools libssl-dev libgnutls28-dev uuid-dev
      - name: U-Boot bauen
        run: os/uboot/build.sh
      - uses: actions/upload-artifact@v4
        with: { name: uboot, path: os/out/uboot }

  kernel:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Abhaengigkeiten
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bc bison flex libssl-dev libelf-dev device-tree-compiler \
            python3 cpio kmod rsync
      - name: Kernel bauen
        run: os/kernel/build.sh
      - name: Paket
        run: tar -C os/out -czf kernel.tgz kernel
      - uses: actions/upload-artifact@v4
        with: { name: kernel, path: kernel.tgz }

  image:
    needs: [uboot, kernel]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Abhaengigkeiten
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mmdebstrap debian-archive-keyring libsdl2-dev libasound2-dev libdrm-dev pkg-config \
            mtools dosfstools e2fsprogs fdisk xz-utils kmod python3-numpy file
      - uses: actions/download-artifact@v4
        with: { name: uboot, path: os/out/uboot }
      - uses: actions/download-artifact@v4
        with: { name: kernel, path: . }
      - name: Groovebox fuer das OS bauen
        run: |
          tar -C os/out -xzf kernel.tgz
          make -j4 DRM=1
          file groovebox
          python3 tools/gensamples.py
      - name: Grundsystem (Debian) bauen
        run: sudo os/rootfs/build.sh "$PWD/groovebox"
      - name: Image zusammensetzen
        run: sudo os/image/build.sh
      - uses: actions/upload-artifact@v4
        with: { name: image, path: os/out/r36s-groovebox-os.img.xz }
      - name: Release "os-nightly" aktualisieren
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete os-nightly --yes --cleanup-tag || true
          gh release create os-nightly os/out/r36s-groovebox-os.img.xz --prerelease \
            --title "SYNTH CITY OS (Test, $(git rev-parse --short HEAD))" \
            --notes "Eigenes SD-Karten-Image fuer den R36S. Mit balenaEtcher oder Raspberry Pi Imager auf eine ZWEITE microSD-Karte schreiben. Anleitung im Handbuch (SYNTH-CITY-Handbuch.pdf im Release nightly, Abschnitt Groovebox-OS)." \
            --target "$GITHUB_SHA"
